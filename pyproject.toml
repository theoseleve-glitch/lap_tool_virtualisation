[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackreco"
version = "0.1.0"
description = "Traceable outdoor kart venue acquisition pipeline for France and Britain"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.1",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "python-dateutil>=2.9",
]

[project.optional-dependencies]
geo = ["shapely>=2.0", "geopandas>=0.14", "pyproj>=3.6"]
test = ["pytest>=8.0"]

[project.scripts]
trackreco = "trackreco.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

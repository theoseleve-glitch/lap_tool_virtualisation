version: '3.9'
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: trackreco
      POSTGRES_USER: trackreco
      POSTGRES_PASSWORD: trackreco
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  api:
    build: .
    command: trackreco-api
    env_file: .env
    depends_on: [db, redis, minio]
    ports: ["8080:8080"]
  worker:
    build: .
    command: trackreco-worker
    env_file: .env
    depends_on: [db, redis, minio]

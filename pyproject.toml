[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackreco"
version = "0.2.0"
description = "Production-grade Outdoor French Kart Track Layout Registry foundation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.8",
  "pydantic-settings>=2.3",
  "python-multipart>=0.0.9",
  "celery>=5.4",
  "redis>=5.0",
  "boto3>=1.35",
  "shapely>=2.0",
  "geoalchemy2>=0.15",
  "python-slugify>=8.0",
  "orjson>=3.10",
  "numpy>=1.26",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
trackreco-api = "trackreco_platform.main:run"
trackreco-worker = "trackreco_platform.workers.jobs:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
